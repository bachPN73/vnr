<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#b91c1c" />
  <title>Flashcard Tài Liệu VNR202 — Chương 1–3 &amp; Đại Hội XIII, XIV</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #475569;
      --border: #e2e8f0;
      --accent: #b91c1c;
      --accent-soft: #fef2f2;
      --gold: #d97706;
      --gold-bg: #fef3c7;
      --ok: #15803d;
      --ok-bg: #dcfce7;
      --err: #b91c1c;
      --err-bg: #fee2e2;
      --shadow: 0 6px 24px rgba(15, 23, 42, 0.08);
    }
    body.dark {
      --bg: #0b1120;
      --card: #111827;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --border: #1e293b;
      --accent: #ef4444;
      --accent-soft: #2a1215;
      --gold: #f59e0b;
      --gold-bg: #3b2606;
      --ok: #4ade80;
      --ok-bg: #052e16;
      --err: #f87171;
      --err-bg: #450a0a;
      --shadow: 0 6px 26px rgba(0, 0, 0, 0.45);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; overflow-x: hidden; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 40;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      box-shadow: 0 2px 10px rgba(15, 23, 42, 0.05);
    }
    .topbar {
      max-width: 860px;
      margin: 0 auto;
      padding: 10px 14px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .brand-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .back-link {
      text-decoration: none;
      color: var(--text);
      border: 1px solid var(--border);
      background: var(--bg);
      padding: 6px 11px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      white-space: nowrap;
    }
    .back-link:hover { border-color: var(--accent); color: var(--accent); }
    .title {
      font-weight: 800;
      font-size: 1rem;
      color: var(--accent);
    }
    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .search-input {
      padding: 7px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      color: var(--text);
      font-size: 0.9rem;
      width: 210px;
    }
    .icon-btn {
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      border-radius: 8px;
      min-width: 38px;
      min-height: 38px;
      cursor: pointer;
      font-size: 1rem;
    }

    .cat-bar {
      max-width: 860px;
      margin: 0 auto;
      padding: 0 14px 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .cat-chip {
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--muted);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.83rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      transition: all 0.15s;
    }
    .cat-chip.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .cat-chip.star-chip.active {
      background: var(--gold);
      border-color: var(--gold);
      color: #fff;
    }

    main {
      flex: 1;
      width: 100%;
      max-width: 820px;
      margin: 16px auto 0;
      padding: 0 14px calc(28px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
    }

    .progress-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
      font-size: 0.88rem;
      color: var(--muted);
      flex-wrap: wrap;
    }
    .stats-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
    }
    .stat-ok { color: var(--ok); }
    .stat-err { color: var(--err); }
    .progress-track {
      height: 6px;
      width: 100%;
      background: var(--border);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 14px;
    }
    .progress-fill {
      height: 100%;
      background: var(--accent);
      width: 0%;
      transition: width 0.2s ease;
    }

    .card {
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 16px;
      padding: 22px 22px 18px;
      box-shadow: var(--shadow);
      touch-action: pan-y;
      transition: border-color 0.15s ease;
    }
    .card-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
    }
    .tag {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 0.76rem;
      font-weight: 700;
      background: var(--accent-soft);
      color: var(--accent);
    }
    .star-btn {
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--muted);
      border-radius: 8px;
      padding: 5px 10px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
    }
    .star-btn.starred {
      background: var(--gold-bg);
      border-color: var(--gold);
      color: var(--gold);
    }

    .question-text {
      font-size: 1.08rem;
      font-weight: 700;
      margin-bottom: 14px;
      line-height: 1.5;
    }

    .options-grid {
      display: grid;
      gap: 9px;
      margin-bottom: 14px;
    }
    .opt-item {
      width: 100%;
      text-align: left;
      padding: 12px 14px;
      min-height: 46px;
      border-radius: 10px;
      border: 1.5px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 0.95rem;
      line-height: 1.45;
      cursor: pointer;
      transition: all 0.12s ease;
    }
    .opt-item:hover:not(.locked) { border-color: var(--accent); }
    .card.revealed .opt-item.is-correct,
    .opt-item.picked-correct {
      background: var(--ok-bg);
      border-color: var(--ok);
      color: var(--ok);
      font-weight: 700;
    }
    .opt-item.picked-wrong {
      background: var(--err-bg);
      border-color: var(--err);
      color: var(--err);
      font-weight: 600;
    }

    .answer-banner {
      display: none;
      padding: 11px 14px;
      border-radius: 10px;
      background: var(--ok-bg);
      color: var(--ok);
      font-weight: 700;
      font-size: 0.94rem;
      margin-bottom: 8px;
    }
    .card.revealed .answer-banner { display: block; }

    .card-hint {
      text-align: center;
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 6px;
    }

    .nav-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 14px;
    }
    .btn {
      border: none;
      background: var(--accent);
      color: #fff;
      padding: 11px 12px;
      min-height: 46px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn:active { opacity: 0.85; }
    .btn.secondary {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .extra-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 12px;
      padding: 10px 14px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 0.85rem;
      color: var(--muted);
    }
    .jump-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .jump-input {
      width: 68px;
      padding: 5px 8px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: var(--bg);
      color: var(--text);
      font-size: 0.9rem;
      text-align: center;
    }
    .mini-btn {
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      padding: 5px 10px;
      border-radius: 7px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
    }

    @media (max-width: 680px) {
      .topbar { padding: 9px 12px; gap: 8px; }
      .brand-group { width: 100%; justify-content: space-between; }
      .title { font-size: 0.94rem; }
      .top-actions { width: 100%; }
      .search-input { flex: 1; width: auto; font-size: 16px; min-height: 40px; }
      .icon-btn { min-width: 40px; min-height: 40px; }
      .cat-bar {
        flex-wrap: nowrap;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
        padding: 0 12px 9px;
      }
      .cat-bar::-webkit-scrollbar { display: none; }
      main { margin-top: 10px; padding: 0 10px calc(24px + env(safe-area-inset-bottom)); }
      .card { padding: 16px 14px 14px; border-radius: 14px; }
      .question-text { font-size: 0.98rem; }
      .opt-item { font-size: 0.9rem; padding: 11px 12px; min-height: 48px; }
      .nav-grid { grid-template-columns: 1fr 1fr; }
      .jump-input { font-size: 16px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="topbar">
      <div class="brand-group">
        <a class="back-link" href="index.html">← Trang chính</a>
        <div class="title">🃏 FLASHCARD TÀI LIỆU MỚI</div>
      </div>
      <div class="top-actions">
        <input id="searchBox" class="search-input" type="search" placeholder="Tìm câu hỏi, Đại hội XIV..." />
        <button id="themeBtn" class="icon-btn" title="Sáng / Tối">🌙</button>
      </div>
    </div>
    <div class="cat-bar" id="catBar">
      <button class="cat-chip active" data-cat="all">📚 Tất cả (<span id="cnt-all">0</span>)</button>
      <button class="cat-chip" data-cat="dh1_12">🏛 Đại hội I–XII (<span id="cnt-dh1_12">0</span>)</button>
      <button class="cat-chip" data-cat="dh13">🏛 Đại hội XIII (<span id="cnt-dh13">0</span>)</button>
      <button class="cat-chip" data-cat="dh14">🚀 Đại hội XIV (<span id="cnt-dh14">0</span>)</button>
      <button class="cat-chip" data-cat="nhapmon">📘 Nhập môn &amp; KL (<span id="cnt-nhapmon">0</span>)</button>
      <button class="cat-chip" data-cat="c1">1️⃣ Chương 1 (<span id="cnt-c1">0</span>)</button>
      <button class="cat-chip" data-cat="c2">2️⃣ Chương 2 (<span id="cnt-c2">0</span>)</button>
      <button class="cat-chip" data-cat="c3">3️⃣ Chương 3 (<span id="cnt-c3">0</span>)</button>
      <button class="cat-chip star-chip" data-cat="starred">⭐ Cần ôn (<span id="cnt-star">0</span>)</button>
    </div>
  </header>

  <main>
    <div class="progress-row">
      <div>Thẻ <strong id="curIdx">1</strong> / <strong id="curTotal">0</strong></div>
      <div class="stats-pill">
        <span class="stat-ok">✓ <span id="okCnt">0</span></span>
        <span class="stat-err">✕ <span id="errCnt">0</span></span>
        <button class="mini-btn" onclick="resetStats()" title="Đặt lại điểm phiên học">↻</button>
      </div>
    </div>
    <div class="progress-track"><div id="progressFill" class="progress-fill"></div></div>

    <div id="card" class="card">
      <div class="card-meta">
        <span id="catBadge" class="tag">Chương 1</span>
        <button id="starBtn" class="star-btn" onclick="toggleStar()">☆ Đánh dấu ôn lại</button>
      </div>
      <div id="qText" class="question-text"></div>
      <div id="optGrid" class="options-grid"></div>
      <div id="ansBanner" class="answer-banner"></div>
      <div class="card-hint">👆 Chạm chọn A/B/C/D để tự kiểm tra · Hoặc bấm <strong>Lật đáp án</strong> · 👈👉 Vuốt trái/phải đổi thẻ</div>
    </div>

    <div class="nav-grid">
      <button class="btn secondary" onclick="step(-1)">← Thẻ trước</button>
      <button class="btn secondary" onclick="step(1)">Thẻ tiếp →</button>
      <button class="btn" id="flipBtn" onclick="toggleReveal()">👁 Lật đáp án</button>
      <button class="btn secondary" onclick="shuffleDeck()">🔀 Xáo trộn</button>
    </div>

    <div class="extra-bar">
      <div class="jump-group">
        <span>Nhảy tới thẻ:</span>
        <input id="jumpInput" class="jump-input" type="number" min="1" placeholder="Số" />
        <button class="mini-btn" onclick="jumpTo()">Đi</button>
      </div>
      <div>Phím tắt PC: <code>1–4</code> chọn A–D · <code>Space</code> lật · <code>←/→</code> đổi thẻ · <code>S</code> đánh dấu</div>
    </div>
  </main>

  <script src="tailieu_data.js"></script>
  <script>
    const ALL_CARDS = window.TAILIEU_CARDS || [];
    const CAT_LABELS = {
      nhapmon: 'Nhập môn & Kết luận (Giáo trình)',
      dh1_12: 'Các Đại hội Đảng I–XII',
      c1: 'Chương 1 (1930–1945)',
      c2: 'Chương 2 (1945–1975)',
      c3: 'Chương 3 (1975–nay)',
      dh13: 'Đại hội XIII (2021)',
      dh14: 'Đại hội XIV (2026)'
    };

    // Theme sync
    const themeBtn = document.getElementById('themeBtn');
    if (localStorage.getItem('lsd_dark') === '1') {
      document.body.classList.add('dark');
      themeBtn.textContent = '☀️';
    }
    themeBtn.addEventListener('click', () => {
      document.body.classList.toggle('dark');
      const d = document.body.classList.contains('dark');
      themeBtn.textContent = d ? '☀️' : '🌙';
      localStorage.setItem('lsd_dark', d ? '1' : '0');
    });

    // Stars persisted
    let starredIds = new Set(JSON.parse(localStorage.getItem('lsd_tailieu_stars') || '[]'));
    function saveStars() {
      localStorage.setItem('lsd_tailieu_stars', JSON.stringify([...starredIds]));
      document.getElementById('cnt-star').textContent = starredIds.size;
    }

    // Category counts
    function updateCounts() {
      document.getElementById('cnt-all').textContent = ALL_CARDS.length;
      ['nhapmon', 'dh1_12', 'c1', 'c2', 'c3', 'dh13', 'dh14'].forEach(c => {
        document.getElementById('cnt-' + c).textContent = ALL_CARDS.filter(x => x.cat === c).length;
      });
      document.getElementById('cnt-star').textContent = starredIds.size;
    }

    let activeCat = 'all';
    let searchTerm = '';
    let deck = ALL_CARDS.slice();
    let pos = 0;
    let okCnt = 0;
    let errCnt = 0;
    let answeredInCard = false;

    function rebuildDeck() {
      let list = ALL_CARDS;
      if (activeCat === 'starred') {
        list = list.filter(x => starredIds.has(x.id));
      } else if (activeCat !== 'all') {
        list = list.filter(x => x.cat === activeCat);
      }
      if (searchTerm) {
        const s = searchTerm.toLowerCase();
        list = list.filter(x =>
          x.q.toLowerCase().includes(s) ||
          x.answer.toLowerCase().includes(s) ||
          x.options.some(o => o.toLowerCase().includes(s))
        );
      }
      deck = list.slice();
      pos = 0;
      render();
    }

    function render() {
      const cardEl = document.getElementById('card');
      const optGrid = document.getElementById('optGrid');
      const ansBanner = document.getElementById('ansBanner');
      cardEl.classList.remove('revealed');
      answeredInCard = false;

      if (!deck.length) {
        document.getElementById('curIdx').textContent = 0;
        document.getElementById('curTotal').textContent = 0;
        document.getElementById('progressFill').style.width = '0%';
        document.getElementById('catBadge').textContent = 'Trống';
        document.getElementById('qText').textContent = activeCat === 'starred'
          ? 'Bạn chưa đánh dấu thẻ nào cần ôn. Bấm "☆ Đánh dấu ôn lại" trên thẻ khó để lưu vào đây!'
          : 'Không tìm thấy câu hỏi phù hợp.';
        optGrid.innerHTML = '';
        ansBanner.textContent = '';
        return;
      }

      const item = deck[pos];
      document.getElementById('curIdx').textContent = pos + 1;
      document.getElementById('curTotal').textContent = deck.length;
      document.getElementById('progressFill').style.width = (((pos + 1) / deck.length) * 100) + '%';
      document.getElementById('catBadge').textContent = (CAT_LABELS[item.cat] || 'Tài liệu') + ' · #' + item.id;
      document.getElementById('qText').textContent = item.q;
      ansBanner.textContent = '✅ Đáp án đúng: ' + item.answer;

      const sBtn = document.getElementById('starBtn');
      const isStar = starredIds.has(item.id);
      sBtn.classList.toggle('starred', isStar);
      sBtn.textContent = isStar ? '★ Đã đánh dấu' : '☆ Đánh dấu ôn lại';

      optGrid.innerHTML = '';
      item.options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'opt-item' + (opt[0] === item.letter ? ' is-correct' : '');
        btn.textContent = opt;
        btn.onclick = (e) => {
          e.stopPropagation();
          if (answeredInCard || cardEl.classList.contains('revealed')) return;
          answeredInCard = true;
          cardEl.classList.add('revealed');
          if (opt[0] === item.letter) {
            btn.classList.add('picked-correct');
            okCnt++;
          } else {
            btn.classList.add('picked-wrong');
            errCnt++;
          }
          document.getElementById('okCnt').textContent = okCnt;
          document.getElementById('errCnt').textContent = errCnt;
          optGrid.querySelectorAll('.opt-item').forEach(b => b.classList.add('locked'));
        };
        optGrid.appendChild(btn);
      });
    }

    function toggleReveal() {
      if (!deck.length) return;
      document.getElementById('card').classList.toggle('revealed');
    }

    function step(delta) {
      if (!deck.length) return;
      pos = (pos + delta + deck.length) % deck.length;
      render();
    }

    function shuffleDeck() {
      for (let i = deck.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [deck[i], deck[j]] = [deck[j], deck[i]];
      }
      pos = 0;
      render();
    }

    function toggleStar() {
      if (!deck.length) return;
      const id = deck[pos].id;
      if (starredIds.has(id)) starredIds.delete(id);
      else starredIds.add(id);
      saveStars();
      if (activeCat === 'starred') {
        rebuildDeck();
      } else {
        const sBtn = document.getElementById('starBtn');
        const isStar = starredIds.has(id);
        sBtn.classList.toggle('starred', isStar);
        sBtn.textContent = isStar ? '★ Đã đánh dấu' : '☆ Đánh dấu ôn lại';
      }
    }

    function resetStats() {
      okCnt = 0; errCnt = 0;
      document.getElementById('okCnt').textContent = 0;
      document.getElementById('errCnt').textContent = 0;
    }

    function jumpTo() {
      const val = parseInt(document.getElementById('jumpInput').value, 10);
      if (!isNaN(val) && val >= 1 && val <= deck.length) {
        pos = val - 1;
        render();
      }
    }

    // Category filter click
    document.querySelectorAll('.cat-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        document.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        activeCat = chip.dataset.cat;
        rebuildDeck();
      });
    });

    // Search
    const searchBox = document.getElementById('searchBox');
    searchBox.addEventListener('input', () => {
      searchTerm = searchBox.value.trim();
      rebuildDeck();
    });

    // Touch swipe on mobile
    const cardEl = document.getElementById('card');
    let sx = 0, sy = 0;
    cardEl.addEventListener('touchstart', e => {
      sx = e.changedTouches[0].clientX;
      sy = e.changedTouches[0].clientY;
    }, { passive: true });
    cardEl.addEventListener('touchend', e => {
      const dx = e.changedTouches[0].clientX - sx;
      const dy = e.changedTouches[0].clientY - sy;
      if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.4) {
        if (dx < 0) step(1);
        else step(-1);
      }
    }, { passive: true });

    // Keyboard shortcuts
    document.addEventListener('keydown', e => {
      if (document.activeElement === searchBox || document.activeElement.id === 'jumpInput') return;
      if (e.code === 'Space') { e.preventDefault(); toggleReveal(); }
      else if (e.code === 'ArrowRight') step(1);
      else if (e.code === 'ArrowLeft') step(-1);
      else if (e.key.toLowerCase() === 's') toggleStar();
      else if (['1', '2', '3', '4'].includes(e.key)) {
        const btns = document.querySelectorAll('#optGrid .opt-item');
        const idx = parseInt(e.key, 10) - 1;
        if (btns[idx]) btns[idx].click();
      }
    });

    updateCounts();
    render();
  </script>
</body>
</html>
